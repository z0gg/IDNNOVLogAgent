[PARSER]
    Name        syslog-rfc5424
    Format      regex
    Regex       ^\<(?<pri>[0-9]{1,5})\>1 (?<time>[^ ]+) (?<host>[^ ]+) (?<ident>[^ ]+) (?<pid>[-0-9]+) (?<msgid>[^ ]+) (?<extradata>(\[(.*?)\]|-)) (?<message>.+)$
    Time_Key    time
    # Fluent Bit 5.0.9: combining %L with %z makes strptime silently DROP the
    # UTC offset (validated on bench: "13:20:22-04:00" indexed as 13:20 UTC
    # instead of 17:20 UTC). DSM Log Center never emits fractional seconds
    # (verified 1.0.10-1011), so we parse %z strictly without %L.
    Time_Format %Y-%m-%dT%H:%M:%S%z
    Time_Strict Off
    Time_Keep   On
